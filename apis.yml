name: Plunk
kind: company
description: Plunk is an open-source (AGPL-3.0) email platform for developers that unifies
  transactional email, marketing campaigns, contact segmentation and event-driven workflow
  automation behind a single REST API. It publishes its own OpenAPI 3.1.0 at
  docs.useplunk.com/openapi.json, declaring next-api.useplunk.com as the production base URL,
  and authenticates with a two-class Bearer API key where the prefix decides capability — sk_
  for every endpoint and pk_ for the client-safe /v1/track tracking call. The API supports
  Idempotency-Key on both public write endpoints, cursor pagination, a structured error
  envelope carrying machine codes plus remediation hints, and a documented webhook event
  catalogue delivered as workflow steps. Every documentation page is also served as Markdown.
  The entire stack self-hosts with Docker Compose for full data ownership and no per-email costs.
