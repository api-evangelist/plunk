apis:
- aid: plunk:plunk-api
  name: Plunk API
  description: >-
    Plunk's own published OpenAPI 3.1.0, served at https://docs.useplunk.com/openapi.json
    and declaring https://next-api.useplunk.com as the production base URL. Covers the
    public API (transactional send, event tracking, email verification) plus the contacts,
    templates, campaigns and segments resources. Authenticated with a Bearer API key whose
    prefix decides its capability — sk_ for every endpoint except POST /v1/track, which
    requires pk_. POST /v1/send and POST /v1/track accept an Idempotency-Key header. Lists
    are cursor paginated. This is the first-party contract; the four hand-authored specs
    below predate it and cover the older api.useplunk.com surface.
  humanURL: https://docs.useplunk.com/api-reference/overview
  baseURL: https://next-api.useplunk.com
