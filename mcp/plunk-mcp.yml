    The published OpenAPI models 15 operations; the API reference documents
    roughly 120 endpoints across workflows, events, domains, activity,
    analytics, uploads, bulk jobs and project administration. A candidate tool
    list derived from the spec therefore covers only the documented-in-spec
    slice. The unmodelled endpoints are enumerated in
    data-model/plunk-data-model.yml rather than guessed at here.
  spec_operations: 15
