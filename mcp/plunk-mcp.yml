tools:
  note: >-
    DERIVED CANDIDATE ONLY. One tool per operationId in the published OpenAPI.
    Each tool's real input contract is that operation's parameters + requestBody
    in openapi/_original/plunk-api-openapi.json; nothing here was invented.
  items:
  - {name: send_email, description: Send a transactional email to one or more recipients, source_operation: 'openapi/_original/plunk-api-openapi.json#sendEmail', consequence: write, note: Supports Idempotency-Key; billable per recipient.}
  - {name: track_event, description: Track an event for a contact, upserting the contact and triggering workflows, source_operation: 'openapi/_original/plunk-api-openapi.json#trackEvent', consequence: write, note: 'The one operation requiring a public (pk_) key rather than a secret key. Supports Idempotency-Key.'}
  - {name: verify_email, description: Validate an email address for format, MX records, disposable domains and typos, source_operation: 'openapi/_original/plunk-api-openapi.json#verifyEmail', consequence: read}
  - {name: list_contacts, description: List contacts with cursor pagination and email substring search, source_operation: 'openapi/_original/plunk-api-openapi.json#listContacts', consequence: read}
  - {name: create_contact, description: Create or upsert a contact by email, source_operation: 'openapi/_original/plunk-api-openapi.json#createContact', consequence: write}
  - {name: get_contact, description: Get a single contact by ID, source_operation: 'openapi/_original/plunk-api-openapi.json#getContact', consequence: read}
  - {name: update_contact, description: Update a contact's email, subscription state or custom data fields, source_operation: 'openapi/_original/plunk-api-openapi.json#updateContact', consequence: write}
  - {name: delete_contact, description: Delete a contact, source_operation: 'openapi/_original/plunk-api-openapi.json#deleteContact', consequence: destructive}
  - {name: list_templates, description: List email templates, source_operation: 'openapi/_original/plunk-api-openapi.json#listTemplates', consequence: read}
  - {name: create_template, description: Create an email template on a verified sending domain, source_operation: 'openapi/_original/plunk-api-openapi.json#createTemplate', consequence: write}
  - {name: list_campaigns, description: List campaigns, source_operation: 'openapi/_original/plunk-api-openapi.json#listCampaigns', consequence: read}
  - {name: create_campaign, description: Create a campaign in DRAFT status, source_operation: 'openapi/_original/plunk-api-openapi.json#createCampaign', consequence: write}
  - {name: send_campaign, description: Send or schedule a campaign, source_operation: 'openapi/_original/plunk-api-openapi.json#sendCampaign', consequence: physical, note: 'Highest-consequence operation in the surface — sends to a whole audience and is billed per recipient. Not reversible once SENDING. Should require human confirmation.'}
