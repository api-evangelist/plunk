- id: llms-txt
  conforms: true
  evidence: 'Served at both https://www.useplunk.com/llms.txt and https://docs.useplunk.com/llms.txt (200), each a well-formed llms.txt with H1, blockquote summary and sectioned link lists. The docs variant explicitly links the OpenAPI.'
- id: markdown-content-negotiation
  conforms: true
  evidence: >-
    Every documentation page is available as Markdown by appending .md or
    sending Accept: text/markdown, on both the marketing site and the docs site.
    API reference pages render the OpenAPI operation into the Markdown response.
    Shipped in v0.9.0/v0.10.0. This is a deliberate, working agent-readable
    documentation surface — rarer than llms.txt and more useful.
- id: gdpr
  conforms: true
  evidence: 'https://www.useplunk.com/privacy is structured around GDPR — data controller identification, lawful bases for processing, data subject rights, sub-processor disclosure (AWS SES under an AWS DPA and Standard Contractual Clauses, Stripe), retention schedule. A standalone DPA is published at https://www.useplunk.com/dpa.'
- id: soc2
