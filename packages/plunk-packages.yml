source: >-
  npm registry metadata (registry.npmjs.org), PyPI, the useplunk GitHub
  organization, and https://docs.useplunk.com/api-reference/overview
note: >-
  Plunk ships exactly one first-party client library, @plunk/node, from
  github.com/useplunk/node. Its last publish (3.0.3, 2024-10-15) predates the
  rewritten API this repo now profiles: the current API reference documents
  https://next-api.useplunk.com, cursor pagination, an Idempotency-Key header,
  templates/segments/workflows resources and a structured error envelope, none
  of which the SDK was released against. The docs no longer show an SDK install
  anywhere — the "Client libraries" section of the API reference is raw fetch /
  requests / curl snippets only. Treat the official SDK as unmaintained relative
  to the live contract. The pricing page's claim of "SDKs for Node.js, Python,
  and more" is not substantiated by any published first-party Python package.
