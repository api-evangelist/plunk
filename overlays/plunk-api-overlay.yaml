x-source: >-
  Derived from artifacts in this repo (conventions/, errors/, lifecycle/,
  asyncapi/, data-model/) against Plunk's published OpenAPI 3.1.0. Captures API
  Evangelist annotations only — the harvested spec is never mutated.
actions:
- target: $.info
  update:
    x-apievangelist-slug: plunk
    x-apievangelist-profile: https://apis.io/provider/plunk
    x-apievangelist-artifacts:
      conventions: conventions/plunk-conventions.yml
      errors: errors/plunk-problem-types.yml
      lifecycle: lifecycle/plunk-lifecycle.yml
      webhooks: asyncapi/plunk-webhooks.yml
