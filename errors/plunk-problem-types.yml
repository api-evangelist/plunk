   remediation: 'The operation was NOT performed a second time. details carries {key, originalRequest, originalRequestAt, originalStatusCode}. An originalStatusCode of null means the original request is still in flight and this one lost the race. Plunk refuses rather than replaying, so the original resource ID is not returned — record it on first success. Keys expire after 24h.',
   source_doc: https://docs.useplunk.com/guides/idempotency}
