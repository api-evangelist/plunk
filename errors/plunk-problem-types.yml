- {code: CAMPAIGN_NOT_FOUND, status: 404, category: resource, title: Campaign does not exist}
- {code: WORKFLOW_NOT_FOUND, status: 404, category: resource, title: Workflow does not exist}
- {code: CONFLICT, status: 409, category: resource, title: Resource conflict,
   remediation: 'Raised when creating a contact with an existing email, updating to an email already taken, or deleting a campaign/segment that has active executions or is used by an active campaign.'}
