- {code: BILLING_LIMIT_EXCEEDED, status: 402, category: billing, title: Billing limit reached,
   remediation: 'A per-category monthly cap (Transactional, Campaigns, Workflows, Inbound) or the plan allowance was exceeded. Queue the work or surface it to the user; caps reset at the start of each billing period.'}
