source: https://docs.useplunk.com/api-reference/errors
spec: openapi/_original/plunk-api-openapi.json
format: custom-envelope
rfc9457: false
note: >-
  Plunk publishes a complete machine-readable error-code registry with a
  documented envelope, but it is NOT RFC 9457 application/problem+json. Errors
  are returned as application/json in Plunk's own shape. The envelope is
  unusually rich for its class: every error carries a stable machine code, a
  correlation requestId, and — uniquely — a human remediation `suggestion`
  string. Field-level validation detail arrives as an errors[] array.

envelope:
  media_type: application/json
  fields:
  - {name: success, type: boolean, description: Always false for errors.}
  - {name: error.code, type: string, description: Machine-readable error code. Use this for programmatic handling, not the status code.}
  - {name: error.message, type: string, description: Human-readable description.}
  - {name: error.statusCode, type: integer, description: HTTP status code, mirrored into the body.}
  - {name: error.requestId, type: string, description: Correlation ID, also returned in the X-Request-ID response header.}
  - {name: error.errors, type: array, description: "Field-level validation detail: {field, message, code}. Validation errors only."}
  - {name: error.details, type: object, description: Additional error context (e.g. the resource and id on a 404, or the original request on an idempotency conflict).}
  - {name: error.suggestion, type: string, description: Remediation hint for fixing the request.}
  - {name: timestamp, type: string, format: date-time, description: When the error occurred.}
  correlation_header: X-Request-ID

legacy_envelope:
  applies_to: [POST /contacts, POST /templates, POST /segments]
  status: 400
  shape: '{"error": "<string>"}'
  schema: openapi/_original/plunk-api-openapi.json#/components/schemas/LegacyError
  note: >-
    Documented deviation. The hand-validated create endpoints return a bare flat
    error string for missing required fields. Errors raised deeper in those same
    endpoints (404, 409, domain verification) use the standard envelope. Clients
    must branch on shape for these three routes.

status_codes:
- {status: 200, meaning: Request successful}
- {status: 201, meaning: Resource created}
- {status: 204, meaning: "Deleted (DELETE /contacts/{id})"}
- {status: 400, meaning: Invalid request format or parameters}
- {status: 401, meaning: Authentication failed or missing}
- {status: 402, meaning: Billing limit reached or plan upgrade required}
- {status: 403, meaning: Not authorized, email verification required, or project disabled}
- {status: 404, meaning: Resource does not exist}
- {status: 409, meaning: Conflict with current resource state, including idempotency-key reuse}
- {status: 422, meaning: Request validation failed; see the errors array}
- {status: 429, meaning: Rate limit exceeded}
- {status: 500, meaning: Unexpected server error}

problems:
# --- Authentication & authorization ---
- {code: UNAUTHORIZED, status: 401, category: auth, title: General authentication failure}
- {code: INVALID_CREDENTIALS, status: 401, category: auth, title: Login credentials are incorrect}
- {code: MISSING_AUTH, status: 401, category: auth, title: Authorization header is missing or malformed,
   remediation: 'Include an Authorization header of the form "Authorization: Bearer YOUR_API_KEY".'}
- {code: INVALID_API_KEY, status: 401, category: auth, title: API key is invalid or not found,
   remediation: 'Verify the key and that its class matches the endpoint — sk_ for every endpoint except POST /v1/track, pk_ for POST /v1/track. A key of the wrong class is rejected with this code.'}
- {code: FORBIDDEN, status: 403, category: auth, title: Not allowed to perform this action}
- {code: PROJECT_ACCESS_DENIED, status: 403, category: auth, title: No access to this project}
- {code: PROJECT_DISABLED, status: 403, category: auth, title: Project has been disabled}
