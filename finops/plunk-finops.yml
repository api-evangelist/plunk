description: >-
  FinOps view of Plunk spend. On the hosted cloud, Plunk bills a simple
  usage-based rate of $0.001 per email with no base fee and unlimited contacts;
  the Free Forever tier includes 1,000 emails per month at no cost. The primary
  cost driver is email volume, so the dominant FinOps lever is send efficiency.
  Because Plunk is open-source (AGPL-3.0), an alternative cost model is
  self-hosting, which eliminates Plunk per-email fees and shifts spend to your
  own infrastructure and outbound email provider.
notes: >-
  Cloud rates as published on the Plunk pricing page; self-hosting trades
  per-email fees for infrastructure and SMTP/provider costs. Verify against the
  pricing page during reconciliation.
