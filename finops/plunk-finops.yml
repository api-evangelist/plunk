meters:
- name: emails_sent
  description: Emails sent through transactional send and campaigns, billed at $0.001 each above the free allowance.
  unit: emails
  aggregation: sum
  dimensions:
  - project
  - type
- name: free_emails
  description: Emails covered by the 1,000-per-month Free Forever allowance, billed at zero.
  unit: emails
  aggregation: sum
  dimensions:
  - project
- name: contacts
  description: Contacts stored in the project; unlimited and not billed.
  unit: contacts
  aggregation: max
  dimensions:
  - project
- name: events_tracked
  description: Contact events published via the track endpoint; not directly billed.
  unit: events
  aggregation: sum
  dimensions:
  - project
principles:
- name: Visibility
  description: Track monthly email volume per project against the free allowance and the $0.001 per-email rate.
- name: Allocation
  description: Use separate projects / API keys per product or environment to attribute email spend to teams.
- name: Optimization
  description: Reduce redundant sends, batch notifications, and prune inactive contacts; for high volume, evaluate self-hosting (AGPL-3.0) to remove per-email fees.
- name: Accountability
  description: Assign an owner per project, review monthly email spend against budget, and decide cloud vs. self-host based on volume.
